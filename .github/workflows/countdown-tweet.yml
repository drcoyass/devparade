name: Countdown Tweet - シングル&アルバム カウントダウン自動投稿

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (ツイートを実際には投稿しない)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 3 * * *'    # 昼 12:00 JST（UTC 03:00）
    - cron: '30 11 * * *'  # 夜 20:30 JST（UTC 11:30）

permissions:
  issues: write
  contents: write

jobs:
  countdown-tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install tweepy twifork

      - name: Generate and post countdown tweet
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python - <<'PYEOF'
          import os, sys, subprocess

          # カウントダウンツイートを生成
          result = subprocess.run(
              ['python3', 'scripts/countdown_tweets.py'],
              capture_output=True, text=True
          )
          output = result.stdout
          print("=== Countdown output ===")
          print(output[:500])

          # 投稿テキストを抽出（最初の区切り線の間の本文）
          tweet_text = None
          in_tweet = False
          lines = []
          for line in output.split('\n'):
              if '----------------------------------------' in line and not in_tweet:
                  in_tweet = True
                  continue
              elif '----------------------------------------' in line and in_tweet:
                  tweet_text = '\n'.join(lines).strip()
                  break
              elif in_tweet:
                  lines.append(line)

          if not tweet_text:
              print("⚠️ Could not extract tweet text")
              sys.exit(0)

          print(f"\n📝 Tweet ({len(tweet_text)} chars):")
          print(tweet_text)

          # DRY RUN チェック
          if os.environ.get('DRY_RUN') == 'true':
              print("\n🔍 DRY RUN - 投稿しません")
              sys.exit(0)

          # x_client経由で投稿（twikit優先）
          sys.path.insert(0, 'scripts')
          from x_client import post_tweet

          tweet_id = post_tweet(tweet_text)
          if tweet_id and tweet_id != "dry_run":
              print(f"✅ Posted! Tweet ID: {tweet_id}")
              print(f"   URL: https://x.com/devparade/status/{tweet_id}")
              with open('/tmp/tweet_result.txt', 'w') as f:
                  f.write(f"ID: {tweet_id}\nText:\n{tweet_text}")
          else:
              print("❌ 投稿失敗")
              with open('/tmp/tweet_result.txt', 'w') as f:
                  f.write(f"Failed\nText:\n{tweet_text}")
          PYEOF

      - name: Commit state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json data/*.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🤖 [skip ci] Update countdown state"
          git pull --rebase || true
          git push || echo "Push failed (concurrent update)"

      - name: Create Issue log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          RESULT=$(cat /tmp/tweet_result.txt 2>/dev/null || echo "No result (dry run or error)")
          gh issue create \
            --repo drcoyass/devparade \
            --title "🍖 [カウントダウン日報] ${DATE}" \
            --body "${RESULT}" \
            --label "tweet-ready" || true

