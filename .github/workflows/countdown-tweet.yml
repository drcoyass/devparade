name: Countdown Tweet - シングル&アルバム カウントダウン自動投稿

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (ツイートを実際には投稿しない)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 3 * * *'    # 昼 12:00 JST（UTC 03:00）
    - cron: '30 11 * * *'  # 夜 20:30 JST（UTC 11:30）

permissions:
  issues: write
  contents: write

jobs:
  countdown-tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install tweepy

      - name: Generate and post countdown tweet
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python - <<'PYEOF'
          import os, sys, subprocess, re, tweepy

          # カウントダウンツイートを生成
          result = subprocess.run(
              ['python3', 'scripts/countdown_tweets.py'],
              capture_output=True, text=True
          )
          output = result.stdout
          print("=== Countdown output ===")
          print(output[:500])

          # 投稿テキストを抽出（最初の区切り線の間の本文）
          tweet_text = None
          in_tweet = False
          lines = []
          for line in output.split('\n'):
              if '----------------------------------------' in line and not in_tweet:
                  in_tweet = True
                  continue
              elif '----------------------------------------' in line and in_tweet:
                  tweet_text = '\n'.join(lines).strip()
                  break
              elif in_tweet:
                  lines.append(line)

          if not tweet_text:
              print("⚠️ Could not extract tweet text")
              sys.exit(0)

          print(f"\n📝 Tweet ({len(tweet_text)} chars):")
          print(tweet_text)

          # DRY RUN チェック
          if os.environ.get('DRY_RUN') == 'true':
              print("\n🔍 DRY RUN - 投稿しません")
              sys.exit(0)

          # Tweepy v2 で投稿
          api_key        = os.environ.get('X_API_KEY', '')
          api_secret     = os.environ.get('X_API_SECRET', '')
          access_token   = os.environ.get('X_ACCESS_TOKEN', '')
          access_secret  = os.environ.get('X_ACCESS_SECRET', '')

          if not all([api_key, api_secret, access_token, access_secret]):
              print("⚠️ X API credentials missing. Skipping post.")
              sys.exit(0)

          try:
              client = tweepy.Client(
                  consumer_key=api_key,
                  consumer_secret=api_secret,
                  access_token=access_token,
                  access_token_secret=access_secret
              )
              response = client.create_tweet(text=tweet_text)
              tweet_id = response.data['id']
              print(f"✅ Posted! Tweet ID: {tweet_id}")
              print(f"   URL: https://x.com/devparade/status/{tweet_id}")

              # 結果をファイルに保存
              with open('/tmp/tweet_result.txt', 'w') as f:
                  f.write(f"ID: {tweet_id}\nText:\n{tweet_text}")

          except tweepy.errors.Forbidden as e:
              print(f"❌ Forbidden (403): {e}")
              print("   → X API Free tier does not allow write access.")
              print("   → Please upgrade to Basic tier ($100/mo) or use a different method.")
          except tweepy.errors.TooManyRequests as e:
              print(f"⚠️ Rate limited (429): {e}")
          except Exception as e:
              print(f"❌ Error: {type(e).__name__}: {e}")
          PYEOF

      - name: Commit state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json data/*.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🤖 [skip ci] Update countdown state"
          git push || echo "Nothing to push"

      - name: Create Issue log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          RESULT=$(cat /tmp/tweet_result.txt 2>/dev/null || echo "No result (dry run or error)")
          gh issue create \
            --repo drcoyass/devparade \
            --title "🍖 [カウントダウン日報] ${DATE}" \
            --body "${RESULT}" \
            --label "tweet-ready" || true
