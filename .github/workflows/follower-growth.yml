name: DEV PARADE X Growth Engine & Member RT - フォロワー増加＆メンバーRT自動化

on:
  schedule:
    # 1日3回巡回（昼12:45、夜19:45、深夜23:15 JST）
    - cron: '45 3 * * *'   # 12:45 JST（ランチ後）
    - cron: '45 10 * * *'  # 19:45 JST（帰宅・夜）
    - cron: '15 14 * * *'  # 23:15 JST（深夜リラックス）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（テスト実行・アクション送信なし）'
        required: false
        default: false
        type: boolean

permissions:
  issues: write
  contents: write

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install tweepy python-dotenv requests openai twifork

      - name: Run Growth Engine
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          COYASS_COOKIES_JSON: ${{ secrets.COYASS_COOKIES_JSON }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          PYTHONPATH=scripts:$PYTHONPATH python scripts/follower-growth.py

      - name: Commit and Push state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json || true
          git commit -m "🤖 [skip ci] Update PosiDev growth logs" || echo "No changes to commit"
          git pull --rebase || true
          git push || echo "Push failed (concurrent update)"

      - name: Create Growth Report Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f growth_report.md ]; then
            DATE=$(date +%Y-%m-%d)
            gh issue create \
              --title "📈 [Growth Report] ${DATE}" \
              --body "$(cat growth_report.md)" \
              --label "growth-report" || true
          fi
