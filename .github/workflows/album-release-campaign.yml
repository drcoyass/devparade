name: Album Release Campaign - 8/5〜8/19「全ての武器をお箸に」

on:
  workflow_dispatch:
    inputs:
      day:
        description: '投稿日 (5/12/15/16/17/18/19)'
        required: false
        default: 'auto'
      slot:
        description: '投稿スロット (morning/noon/night)'
        required: false
        default: 'morning'
      dry_run:
        description: 'Dry run (実際には投稿しない)'
        required: false
        default: 'false'
  schedule:
    # 8/5 アルバム全貌公開
    - cron: '0 22 4 8 *'   # 8/5 07:00 JST
    - cron: '0 3 5 8 *'    # 8/5 12:00 JST
    - cron: '30 11 5 8 *'  # 8/5 20:30 JST
    # 8/12 1週間前
    - cron: '0 22 11 8 *'  # 8/12 07:00 JST
    - cron: '30 11 12 8 *' # 8/12 20:30 JST
    # 8/15〜8/18 カウントダウン
    - cron: '0 22 14 8 *'  # 8/15 07:00 JST
    - cron: '0 22 15 8 *'  # 8/16 07:00 JST
    - cron: '0 22 16 8 *'  # 8/17 07:00 JST
    - cron: '0 22 17 8 *'  # 8/18 07:00 JST
    - cron: '30 11 18 8 *' # 8/18 20:30 JST 前夜
    # 8/19 リリース当日
    - cron: '0 15 18 8 *'  # 8/19 00:00 JST
    - cron: '0 22 18 8 *'  # 8/19 07:00 JST
    - cron: '0 3 19 8 *'   # 8/19 12:00 JST
    - cron: '30 11 19 8 *' # 8/19 20:30 JST

permissions:
  issues: write
  contents: read

jobs:
  album-campaign-tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install tweepy

      - name: Determine day and slot
        id: params
        run: |
          DAY="${{ github.event.inputs.day || 'auto' }}"
          SLOT="${{ github.event.inputs.slot || 'auto' }}"

          if [ "$DAY" = "auto" ]; then
            MONTH=$(date -u +%-m)
            DOM=$(date -u +%-d)
            HOUR=$(date -u +%-H)
            MIN=$(date -u +%-M)
            echo "UTC: ${MONTH}/${DOM} ${HOUR}:${MIN}"

            # UTC→JST変換で日程判定
            if   [ "$MONTH" = "8" ] && [ "$DOM" = "4"  ] && [ "$HOUR" = "22" ]; then DAY="5";  SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "5"  ] && [ "$HOUR" = "3"  ]; then DAY="5";  SLOT="noon"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "5"  ] && [ "$HOUR" = "11" ]; then DAY="5";  SLOT="night"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "11" ] && [ "$HOUR" = "22" ]; then DAY="12"; SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "12" ] && [ "$HOUR" = "11" ]; then DAY="12"; SLOT="night"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "14" ] && [ "$HOUR" = "22" ]; then DAY="15"; SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "15" ] && [ "$HOUR" = "22" ]; then DAY="16"; SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "16" ] && [ "$HOUR" = "22" ]; then DAY="17"; SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "17" ] && [ "$HOUR" = "22" ]; then DAY="18"; SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "18" ] && [ "$HOUR" = "11" ]; then DAY="18"; SLOT="night"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "18" ] && [ "$HOUR" = "15" ]; then DAY="19"; SLOT="midnight"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "18" ] && [ "$HOUR" = "22" ]; then DAY="19"; SLOT="morning"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "19" ] && [ "$HOUR" = "3"  ]; then DAY="19"; SLOT="noon"
            elif [ "$MONTH" = "8" ] && [ "$DOM" = "19" ] && [ "$HOUR" = "11" ]; then DAY="19"; SLOT="night"
            else DAY="5"; SLOT="morning"
            fi
          fi

          echo "day=$DAY" >> $GITHUB_OUTPUT
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "📅 Day=$DAY Slot=$SLOT"

      - name: Generate tweet text
        id: tweet
        env:
          DAY: ${{ steps.params.outputs.day }}
          SLOT: ${{ steps.params.outputs.slot }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, subprocess, re

          day  = os.environ.get('DAY', '5')
          slot = os.environ.get('SLOT', 'morning')
          print(f"Generating content for day={day} slot={slot}")

          # アルバムコンテンツ生成
          result = subprocess.run(
              ['python3', 'scripts/album_content_generator.py', '--day', day],
              capture_output=True, text=True
          )
          output = result.stdout

          # スロットに応じてセクションを選択
          slot_to_key = {
              'midnight': '0時解禁',
              'morning':  '朝',
              'noon':     '昼',
              'night':    '夜',
          }
          target_key = slot_to_key.get(slot, '朝')

          # テキストブロックを全て抽出
          blocks = re.findall(r'={20,}\n📝 (.+?)\n={20,}\n(.*?)\n\[\d+文字\]', output, re.DOTALL)
          tweet_text = None

          if blocks:
              # 最初のXメイン投稿を使う（スロットに応じて変える）
              slot_idx = {'midnight': -1, 'morning': 0, 'noon': 1, 'night': 2}.get(slot, 0)
              idx = min(slot_idx, len(blocks)-1)
              if idx < 0:
                  idx = len(blocks) + idx
              _, raw = blocks[idx]
              tweet_text = raw.strip()
              # [文字] 行などの不要テキストを除去
              tweet_text = re.sub(r'\n📝.*', '', tweet_text).strip()
          
          if not tweet_text or len(tweet_text) < 10:
              # フォールバック: countdown_tweets.py を使用
              result2 = subprocess.run(
                  ['python3', 'scripts/countdown_tweets.py'],
                  capture_output=True, text=True
              )
              output2 = result2.stdout
              in_tweet = False
              t_lines = []
              for line in output2.split('\n'):
                  if '---' in line and not in_tweet:
                      in_tweet = True; continue
                  elif '---' in line and in_tweet:
                      tweet_text = '\n'.join(t_lines).strip(); break
                  elif in_tweet:
                      t_lines.append(line)

          if tweet_text:
              print(f"\n✅ Tweet ({len(tweet_text)} chars):")
              print(tweet_text[:200])
              with open('/tmp/tweet_text.txt', 'w') as f:
                  f.write(tweet_text)
          else:
              print("❌ No tweet text found")
              sys.exit(0)
          PYEOF

      - name: Post to X (tweepy v2)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DAY: ${{ steps.params.outputs.day }}
          SLOT: ${{ steps.params.outputs.slot }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, tweepy

          tweet_text_file = '/tmp/tweet_text.txt'
          try:
              with open(tweet_text_file) as f:
                  tweet_text = f.read().strip()
          except FileNotFoundError:
              print("⚠️ No tweet text file. Skipping.")
              sys.exit(0)

          api_key       = os.environ.get('X_API_KEY', '')
          api_secret    = os.environ.get('X_API_SECRET', '')
          access_token  = os.environ.get('X_ACCESS_TOKEN', '')
          access_secret = os.environ.get('X_ACCESS_SECRET', '')

          if not all([api_key, api_secret, access_token, access_secret]):
              print("⚠️ Missing X credentials. Set X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET in Secrets.")
              sys.exit(0)

          day  = os.environ.get('DAY', '?')
          slot = os.environ.get('SLOT', '?')

          try:
              client = tweepy.Client(
                  consumer_key=api_key,
                  consumer_secret=api_secret,
                  access_token=access_token,
                  access_token_secret=access_secret,
                  wait_on_rate_limit=True
              )
              response = client.create_tweet(text=tweet_text)
              tweet_id = response.data['id']
              print(f"✅ Posted! day={day} slot={slot}")
              print(f"   Tweet ID: {tweet_id}")
              print(f"   URL: https://x.com/devparade/status/{tweet_id}")
              with open('/tmp/post_result.txt', 'w') as f:
                  f.write(f"✅ Posted: https://x.com/devparade/status/{tweet_id}\n\n{tweet_text}")

          except tweepy.errors.Forbidden as e:
              msg = f"❌ 403 Forbidden: {e}\nX API Free tier does not allow write. Upgrade to Basic tier."
              print(msg)
              with open('/tmp/post_result.txt', 'w') as f:
                  f.write(msg)
          except tweepy.errors.TooManyRequests as e:
              msg = f"⚠️ Rate limited: {e}"
              print(msg)
              with open('/tmp/post_result.txt', 'w') as f:
                  f.write(msg)
          except Exception as e:
              msg = f"❌ {type(e).__name__}: {e}"
              print(msg)
              with open('/tmp/post_result.txt', 'w') as f:
                  f.write(msg)
          PYEOF

      - name: Create Issue log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAY: ${{ steps.params.outputs.day }}
          SLOT: ${{ steps.params.outputs.slot }}
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          TWEET=$(cat /tmp/tweet_text.txt 2>/dev/null | head -5 || echo "N/A")
          RESULT=$(cat /tmp/post_result.txt 2>/dev/null || echo "dry run / no result")
          gh issue create \
            --repo drcoyass/devparade \
            --title "🍖 [アルバムキャンペーン] 8/${DAY} ${SLOT} ${DATE}" \
            --body "## 結果\n${RESULT}\n\n## 投稿テキスト (先頭)\n${TWEET}" \
            --label "tweet-ready" || true
